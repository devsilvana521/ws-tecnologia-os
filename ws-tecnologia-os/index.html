<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0f1c">
<title>WS Tecnologia · Gestão de Ordens de Serviço</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f8cff'/%3E%3Cstop offset='1' stop-color='%237b5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='800' font-size='26' fill='white' text-anchor='middle'%3EWS%3C/text%3E%3C/svg%3E">
<meta name="description" content="Sistema de gestão de ordens de serviço da WS Tecnologia — desenvolvimento de sistemas.">
<link rel="stylesheet" href="css/style.css">
<script src="js/tema.js"></script>
</head>
<body>
<!-- Tela de abertura -->
<div id="splash"><div class="sp-logo">WS</div><b>WS Tecnologia</b><small>Preparando seu painel…</small><div class="sp-bar"><i></i></div></div>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">WS</div>
      <div><b id="nomeEmpresa">WS Tecnologia</b><small>Desenvolvimento de sistemas</small></div>
    </div>
    <nav class="nav" id="nav">
      <div class="sec">Gestão</div>
      <button data-view="painel" title="Painel"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Painel</span></button>
      <button data-view="ordens" title="Ordens de serviço"><svg class="i" viewBox="0 0 24 24"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M8 12h8M8 16h5"/></svg><span>Ordens de serviço</span><em class="count" id="cntOS"></em></button>
      <button data-view="sistemas" title="Sistemas criados"><svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="m9 9-2 2 2 2M15 9l2 2-2 2"/></svg><span>Sistemas criados</span><em class="count" id="cntSis"></em></button>
      <button data-view="clientes" title="Clientes"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span>Clientes</span></button>
      <button data-view="financeiro" title="Financeiro"><svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6.5 15h4"/></svg><span>Financeiro</span></button>
      <div class="sec">Sistema</div>
      <button data-view="docs" title="Documentação"><svg class="i" viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/><path d="M8 7h8M8 11h6"/></svg><span>Documentação</span></button>
      <button data-view="config" title="Configurações"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Configurações</span></button>
    </nav>
    <div class="grow"></div>
    <div class="team">
      <div class="ttl">Equipe</div>
      <div id="teamSide"></div>
      <div class="theme" id="theme">
        <button data-t="light" title="Tema claro"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Claro</span></button>
        <button data-t="dark" title="Tema escuro"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Escuro</span></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div><h1 id="pgTitulo">Painel</h1><div class="sub" id="pgSub"></div></div>
      <div class="sp"></div>
      <div class="tema-top" role="group" aria-label="Tema do sistema">
        <button data-t="light" title="Tema claro" aria-label="Tema claro"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Claro</span></button>
        <button data-t="dark" title="Tema escuro" aria-label="Tema escuro"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Escuro</span></button>
      </div>
      <label class="searchbox"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="busca" placeholder="Buscar OS, cliente, sistema…"></label>
      <button class="btn pri" data-act="nova"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nova OS</button>
    </div>
    <div class="banner" id="banner"></div>
    <div id="view"></div>
    <footer class="rodape" id="rodape"></footer>
  </main>
</div>

<!-- Drawer da OS -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"></aside>

<!-- Modal nova OS -->
<div class="modal" id="mNova">
  <form class="box card" id="fNova" autocomplete="off">
    <h2>Nova ordem de serviço</h2>
    <p class="muted" style="margin:0 0 18px">Preencha o básico — o restante você completa na OS.</p>
    <div class="grid">
      <div><label class="lbl">Cliente *</label><input class="field" name="cliente" list="dlClientes" required placeholder="Nome do cliente ou empresa"></div>
      <div><label class="lbl">Serviço / sistema *</label><input class="field" name="titulo" required placeholder="Ex.: Sistema de Agendamento Online"></div>
      <div class="grid g2">
        <div><label class="lbl">Tipo</label><select class="field" name="tipo" id="selTipoNova"></select></div>
        <div><label class="lbl">Responsável</label><select class="field" name="responsavel" id="selRespNova"></select></div>
      </div>
      <div class="grid g3">
        <div><label class="lbl">Valor estimado</label><span class="money"><input class="field" name="valor" data-mask="money" inputmode="numeric" placeholder="0,00"></span></div>
        <div><label class="lbl">Prazo de entrega</label><input class="field" type="date" name="prazo"></div>
        <div><label class="lbl">Prioridade</label><select class="field" name="prioridade"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></div>
      </div>
    </div>
    <div class="foot"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri">Criar OS</button></div>
  </form>
</div>

<!-- Modal sistema criado -->
<div class="modal" id="mSis">
  <form class="box card" id="fSis" autocomplete="off">
    <h2 id="sisTitulo">Novo sistema</h2>
    <p class="muted" style="margin:0 0 18px">Seu portfólio de sistemas entregues, com o link de acesso.</p>
    <div class="grid">
      <div><label class="lbl">Nome do sistema *</label><input class="field" name="nome" required placeholder="Ex.: Sistema Financeiro Empresarial"></div>
      <div class="grid g2">
        <div><label class="lbl">Cliente</label><input class="field" name="cliente" list="dlClientes" placeholder="Opcional"></div>
        <div><label class="lbl">Situação</label><select class="field" name="status"><option value="ar">No ar</option><option value="dev">Em desenvolvimento</option><option value="pausado">Pausado</option><option value="demo">Demonstração</option></select></div>
      </div>
      <div><label class="lbl">Link do sistema</label><input class="field" name="link" placeholder="https://…"></div>
      <div><label class="lbl">Repositório / código-fonte</label><input class="field" name="repo" placeholder="https://github.com/…"></div>
      <div class="grid g2">
        <div><label class="lbl">Tecnologias</label><input class="field" name="tec" placeholder="HTML, CSS, JavaScript…"></div>
        <div><label class="lbl">Responsável</label><select class="field" name="responsavel" id="selRespSis"></select></div>
      </div>
      <div><label class="lbl">Descrição</label><textarea class="field" name="descricao" placeholder="O que o sistema faz…" style="min-height:70px"></textarea></div>
      <div><label class="lbl">Data de entrega</label><input class="field" type="date" name="data"></div>
    </div>
    <div class="foot"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri">Salvar sistema</button></div>
  </form>
</div>
<datalist id="dlClientes"></datalist>

<!-- Confirmação -->
<div class="modal" id="mConf">
  <div class="box card" style="max-width:440px"><h2 id="confT">Confirmar</h2><p class="muted" id="confM" style="margin:6px 0 0"></p>
  <div class="foot"><button class="btn" id="confN">Cancelar</button><button class="btn pri" id="confS">Confirmar</button></div></div>
</div>

<input type="file" id="fileUp" multiple hidden>
<input type="file" id="fileFoto" accept="image/*" hidden>
<input type="file" id="fileMd" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
<input type="file" id="fileLogo" accept="image/*" hidden>
<input type="file" id="fileImport" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<!-- Scripts (a ordem importa) -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/views.js"></script>
<script src="js/ordem.js"></script>
<script src="js/readme-padrao.js"></script>
<script src="js/docs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
